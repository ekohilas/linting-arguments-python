[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linting-arguments-python"
version = "0.1.0"
description = "Provides linting rules around function arguments in Python"
authors = [{ name = "Evan Kohilas" }]
requires-python = "~=3.8"
readme = "README.md"
license = "MIT"
dependencies = [
    "pylint>=2.17.5,<3",
    "astroid>=2.15.6,<3",
]

[dependency-groups]
dev = ["pytest>=7.4.0,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/linting_arguments_python"]

[tool.pytest.ini_options]
# Make the top-level `catalog` package importable by the catalog tests without
# packaging it into the wheel (it is test-only fixture data).
pythonpath = ["."]
